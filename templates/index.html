<!DOCTYPE html>
<html lang="en">
<head>
    <title>SehatKita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f6f9;">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary shadow">
    <div class="container">
        <span class="navbar-brand fw-bold">SehatKita</span>
        <h1>test</h1>
    </div>
</nav>

<!-- CONTAINER -->
<div class="container mt-5">

    <!-- HEADER -->
    <div class="text-center mb-5">
        <h1 class="fw-bold">Dashboard Kesehatan</h1>
        <p class="text-muted">Sistem Booking & Manajemen Layanan Kesehatan</p>
    </div>

    <!-- MENU CARD -->
    <div class="row g-4 justify-content-center">

        <!-- BOOKING -->
        <div class="col-md-6">
            <div class="card shadow p-4 h-100 border-0">
                <div class="text-center">
                    <h4 class="mb-3">Booking Layanan</h4>
                    <p class="text-muted">
                        Daftar dan atur jadwal layanan kesehatan
                    </p>
                    <a href="/booking" class="btn btn-primary w-100">
                        Masuk
                    </a>
                </div>
            </div>
        </div>

        <!-- UPLOAD -->
        <div class="col-md-6">
            <div class="card shadow p-4 h-100 border-0">
                <div class="text-center">
                    <h4 class="mb-3">Upload Laporan dan Monitoring</h4>
                    <p class="text-muted">
                        Upload dan simpan dokumen medis
                    </p>
                    <a href="/upload" class="btn btn-success w-100">
                        Upload
                    </a>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
